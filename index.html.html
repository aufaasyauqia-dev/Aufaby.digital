auth:{async signInWithPassword({email,password}){const u=email.split('@')[0];if(!USERS.some(x=>x.toLowerCase()===u)||password!=='demo1234')return{error:{message:'Invalid login credentials'}};session={user:{email}};try{sessionStorage.setItem('aufaby_auth',JSON.stringify(session))}catch(x){}return{data:{session},error:null}},
async getSession(){return{data:{session}}},async signOut(){session=null;try{sessionStorage.removeItem('aufaby_auth')}catch(x){}}},
async rpc(n,{p_nama}){const d=L(),q=norm(p_nama),m=tbl(d,'aufaby_students').filter(s=>s.aktif!==false&&norm(s.nama)===q);
if(!m.length)return{data:{err:'none'},error:null};if(m.length>1)return{data:{err:'dup'},error:null};const r=m[0];
return{data:{s:{id:r.id,nama:r.nama,jk:r.jk,wali:r.wali,prog:r.prog,lvl:r.lvl,lulus:r.lulus,aktif:true,buku_l:r.buku_l,buku_ok:r.buku_ok},
att:tbl(d,'aufaby_attendance').filter(x=>x.sid===r.id).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,6).map(x=>({d:x.d,in_at:x.in_at,out_at:x.out_at,photo_in:x.photo_in,photo_out:x.photo_out})),
notes:tbl(d,'aufaby_notes').filter(x=>x.sid===r.id).map(x=>({sid:x.sid,m:x.m,t:x.t,tutor:x.tutor})),pay:tbl(d,'aufaby_payments').filter(x=>x.sid===r.id)},error:null}}}}
async function init(){ses=null;let live=false;
try{if(sb){const c=new AbortController();setTimeout(()=>c.abort(),4000);await fetch(SB_URL+'/auth/v1/health',{headers:{apikey:SB_KEY},signal:c.signal});live=true}}catch(x){}
if(!live){sb=makeLocal();demo=true;document.body.insertAdjacentHTML('afterbegin','<div style="text-align:center;padding:6px 10px;background:#f3cfd6;font-size:.85rem">Mode demo: data hanya tersimpan di perangkat ini. Pasang di hosting umum agar tersambung ke Supabase.</div>')}
try{const {data}=await sb.auth.getSession();const em=data.session&&data.session.user.email||'';const n=USERS.find(x=>em===x.toLowerCase()+'@aufaby.app');if(n){ses={r:'t',n};await loadAll()}}catch(x){}go()}

/* ===== Portal Tutor ===== */
function tutorV(){
const T=[['siswa','Profil siswa'],['absen','Absensi'],['bayar','ATK & Pembayaran'],['info','Informasi']];
return `<div class="top card hero"><div><h1>Halo, Bunda ${e(ses.n)}!</h1><p class="mut">Selamat datang di Rumah Belajar Aufaby</p></div><button class="ghost" onclick="out()">Keluar</button></div>
<div class="nav" role="tablist">${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';edit=null;go()">${t[1]}</button>`).join('')}</div>
${tab==='siswa'?(edit?formV():listV()):tab==='absen'?absenV():tab==='bayar'?bayarV():infoV()}`}

function listV(){const L=S.students;return `<button onclick="edit='new';go()">+ Tambah siswa baru</button>
${L.length?L.map(s=>`<button class="li" onclick="edit='${s.id}';go()"><span><b>${e(s.nama)}</b><br><span class="mut">No. ${s.id} · ${PROG[s.prog]} ${lbl(s)}</span></span>${s.lulus?'<span class="tag">Lulus</span>':s.aktif===false?'<span class="tag o">Nonaktif</span>':''}</button>`).join(''):'<p class="mut">Belum ada siswa. Tambahkan siswa pertama.</p>'}`}

function fillLvl(sel){const p=$('#f_prog').value;$('#f_lvl').innerHTML=levels(p).map(l=>`<option ${l===sel?'selected':''}>${l}</option>`).join('');$('#lvl_l').textContent=p==='YES'?'Kelas':'Level'}
function formV(){const n=edit==='new',s=n?{id:nextId(),jk:'L',prog:'AHE',lvl:'1'}:find(edit);
setTimeout(()=>fillLvl(s.lvl),0);
const f=(k,l,t='text')=>`<label for="f_${k}">${l}</label><input id="f_${k}" type="${t}" value="${e(s[k])}">`;
const notes=S.notes.filter(x=>x.sid===s.id).sort((a,b)=>b.m.localeCompare(a.m));
return `<button class="ghost" onclick="edit=null;go()">← Daftar siswa</button>
<div class="card"><h2>${n?'Siswa baru':e(s.nama)}</h2><p class="mut">Nomor absen: <b>${s.id}</b></p>
${f('nama','Nama lengkap siswa')}
<div class="g2"><div><label for="f_jk">Jenis kelamin</label><select id="f_jk"><option value="L" ${s.jk==='L'?'selected':''}>Laki-laki</option><option value="P" ${s.jk==='P'?'selected':''}>Perempuan</option></select></div><div>${f('lahir','Tanggal lahir','date')}</div></div>
${f('alamat','Alamat')}${f('wali','Nama wali siswa')}${f('hp','Nomor WhatsApp wali','tel')}
<div class="g2"><div><label for="f_prog">Program</label><select id="f_prog" onchange="fillLvl()">${Object.keys(PROG).map(p=>`<option value="${p}" ${s.prog===p?'selected':''}>${PROG[p]}</option>`).join('')}</select></div><div><label for="f_lvl" id="lvl_l">Level</label><select id="f_lvl"></select></div></div>
<button onclick="saveS()" style="margin-top:12px">Simpan profil</button></div>
${n?'':`<div class="card"><h3>Level &amp; buku</h3><p>${PROG[s.prog]} ${lbl(s)} ${s.lulus?'<span class="tag">Lulus program</span>':''}</p>
${s.buku&&!s.buku.ok?`<p>Buku ${e(s.buku.l)} belum dibayar.</p><button class="warn" onclick="beli('${s.id}')">Sudah beli buku</button>`:s.buku?`<p class="mut">Buku ${e(s.buku.l)} sudah dibeli.</p>`:''}
<button onclick="naik('${s.id}')" ${s.lulus?'disabled':''}>Naik level / lulus</button>
<button class="ghost" onclick="toggleAktif('${s.id}')">${s.aktif===false?'Aktifkan lagi':'Nonaktifkan siswa'}</button></div>
<div class="card"><h3>Perkembangan belajar</h3><label for="n_m">Bulan</label><input id="n_m" type="month" value="${today().slice(0,7)}"><label for="n_t">Catatan tutor</label><textarea id="n_t" rows="3"></textarea><button onclick="addNote('${s.id}')">Simpan catatan</button>
${notes.map(x=>`<div class="card"><b>${x.m}</b> · <span class="mut">Tutor ${e(x.tutor)}</span><br>${e(x.t)}</div>`).join('')}</div>`}`}

async function saveS(){const v=k=>$('#f_'+k).value.trim();if(!v('nama'))return alert('Isi nama siswa.');
const d={nama:v('nama'),jk:v('jk'),lahir:v('lahir'),alamat:v('alamat'),wali:v('wali'),hp:v('hp'),prog:v('prog'),lvl:v('lvl')};
if(edit==='new'){const r=await sb.from('aufaby_students').insert(toS({...d,aktif:true})).select().single();if(!ok(r))return;S.students.push(fromS(r.data))}
else{const s=find(edit);Object.assign(s,d);if(!await persist(s))return}
edit=null;go()}
async function naik(id){let nb=0,bill=null;const s=find(id),L=levels(s.prog),i=L.indexOf(s.lvl);
if(i>=L.length-1){if(!confirm(s.nama+' lulus program '+PROG[s.prog]+'?'))return;s.lulus=true;bill=['Pembayaran kelulusan',1,180000];wa(s,`Selamat! ${sap(s)} ${s.nama} sudah lulus program ${PROG[s.prog]} di Rumah Belajar Aufaby. Terima kasih atas dukungan Bapak/Ibu.`)}
else{if(!confirm(s.nama+' naik ke '+(s.prog==='YES'?'Kelas ':'Level ')+L[i+1]+'?'))return;s.lvl=L[i+1];s.buku={l:s.lvl,ok:false};nb=1;bill=['Buku '+PROG[s.prog]+' '+lbl(s),1,25000];wa(s,`Selamat! ${sap(s)} ${s.nama} naik ke ${lbl(s)} program ${PROG[s.prog]}. Mohon segera membeli buku ${lbl(s)} di Rumah Belajar Aufaby.`)}
await persist(s);if(nb)await addBook(s);if(bill)await newBill(s.id,bill[0],bill[1],bill[2]);go()}
async function addBook(s){const r=await sb.from('aufaby_books').insert(toB({sid:s.id,label:PROG[s.prog]+' '+lbl(s),tagih:today()})).select().single();if(!r.error)S.books.push(fromB(r.data))}
async function beli(id){const s=find(id);s.buku.ok=true;await persist(s);{const p=PAY().find(x=>x.sid===id&&!x.lunas&&x.item.startsWith('Buku '+PROG[s.prog]));if(p)await lunas(p.id,true)}
const b=S.books.filter(x=>x.sid===id&&!x.bayar).pop();
if(b){b.bayar=today();b.by=ses.n;await sb.from('aufaby_books').update({bayar_at:b.bayar,by_tutor:b.by}).eq('id',b.id)}
else{const r=await sb.from('aufaby_books').insert(toB({sid:id,label:PROG[s.prog]+' '+lbl(s),tagih:today(),bayar:today(),by:ses.n})).select().single();if(!r.error)S.books.push(fromB(r.data))}
go()}
async function toggleAktif(id){const s=find(id);s.aktif=s.aktif===false;await persist(s);go()}
async function addNote(id){const t=$('#n_t').value.trim();if(!t)return;const n={sid:id,m:$('#n_m').value,t,tutor:ses.n};if(!ok(await sb.from('aufaby_notes').insert(n)))return;S.notes.push(n);go()}

/* ===== Absensi ===== */
function absenV(){const st=find(selA),a=st&&S.att[today()+'|'+selA]||{};
return `<div class="card"><label for="sa">Pilih siswa</label><select id="sa" onchange="selA=this.value;mode=null;go()"><option value="">Pilih…</option>${active().map(x=>`<option value="${x.id}" ${x.id===selA?'selected':''}>${x.id} – ${e(x.nama)}</option>`).join('')}</select>
${st?`<h2 style="margin-top:12px">${sap(st)} ${e(st.nama)}</h2><p>${a.out?`Sudah pulang jam <b>${hm(a.out)}</b> (datang ${hm(a.in)})`:a.in?`Sudah datang jam <b>${hm(a.in)}</b>`:'Belum hadir hari ini'}</p>
<div class="row"><button onclick="openCam('in')" ${a.in?'disabled':''}>Ambil foto datang</button><button onclick="openCam('out')" ${!a.in||a.out?'disabled':''}>Ambil foto pulang</button></div>
<div id="cam"></div>
${a.out?`<button class="warn" onclick="waPulang()">Kirim WhatsApp pulang</button><p class="mut">WhatsApp membuka teks pesan. Foto bisa dilampirkan manual, atau wali melihatnya di portal.</p>`:''}`:''}</div>`}
async function openCam(m){mode=m;shot=null;$('#cam').innerHTML=`<video id="v" autoplay playsinline muted></video><img id="pv" hidden alt="Hasil foto"><div class="row"><button id="sn" onclick="snap()">Jepret</button><button id="rt" class="ghost" hidden onclick="retake()">Ulangi foto</button><button id="sv" hidden onclick="saveAtt()">Simpan absen</button><button class="ghost" onclick="go()">Batal</button></div>`;
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('#v').srcObject=stream}catch(x){$('#cam').innerHTML='<p class="err">Kamera tidak bisa dibuka. Izinkan akses kamera dan buka halaman lewat HTTPS atau localhost.</p>'}}
function snap(){const v=$('#v'),c=document.createElement('canvas'),w=320;c.width=w;c.height=Math.round(w*v.videoHeight/v.videoWidth)||240;c.getContext('2d').drawImage(v,0,0,c.width,c.height);shot=c.toDataURL('image/jpeg',.5);$('#pv').src=shot;$('#pv').hidden=false;v.hidden=true;$('#sn').hidden=true;$('#rt').hidden=false;$('#sv').hidden=false}
function retake(){shot=null;$('#pv').hidden=true;$('#v').hidden=false;$('#sn').hidden=false;$('#rt').hidden=true;$('#sv').hidden=true}
async function saveAtt(){const d=today(),k=d+'|'+selA,a=S.att[k]||{d,sid:selA},now=new Date().toISOString();
if(mode==='in'){a.in=now;a.pin=shot;a.byIn=ses.n}else{a.out=now;a.pout=shot;a.byOut=ses.n}
const r=await sb.from('aufaby_attendance').upsert({d:a.d,sid:a.sid,in_at:a.in,out_at:a.out||null,photo_in:a.pin||null,photo_out:a.pout||null,by_in:a.byIn||null,by_out:a.byOut||null});
if(!ok(r))return;S.att[k]=a;mode=null;go()}
function waPulang(){const s=find(selA);wa(s,`${sap(s)} ${s.nama} sudah selesai belajar, sudah bisa pulang/dijemput. Foto absen pulang bisa dilihat di portal wali Rumah Belajar Aufaby.`)}

/* ===== Informasi tutor ===== */
function infoV(){const A=Object.values(S.att).filter(a=>a.in),d=today();
const grp=f=>{const m={};A.forEach(a=>{const k=f(a.d);m[k]=(m[k]||0)+1});return Object.entries(m).sort((x,y)=>y[0].localeCompare(x[0]))};
const tb=(h,r)=>`<table><tr><th>${h}</th><th>Hadir</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')||'<tr><td colspan=2 class="mut">Belum ada data.</td></tr>'}</table>`;
return `<div class="g2"><div class="card"><h2>${active().length}</h2><span class="mut">Murid aktif</span></div><div class="card"><h2>${A.filter(a=>a.d===d).length}</h2><span class="mut">Hadir hari ini</span></div></div>
<div class="card"><h3>Rekap kehadiran</h3><button onclick="csv()">Unduh spreadsheet (CSV)</button><p class="mut">Buka di Excel atau Google Sheets untuk melihat dan mengedit.</p>
<h3>Per tanggal</h3>${tb('Tanggal',grp(x=>x).slice(0,31))}<h3 style="margin-top:12px">Per bulan</h3>${tb('Bulan',grp(x=>x.slice(0,7)))}<h3 style="margin-top:12px">Per tahun</h3>${tb('Tahun',grp(x=>x.slice(0,4)))}</div>${bukuV()}`}
function bukuV(){const B=(S.books||[]).slice().sort((a,b)=>String(b.tagih).localeCompare(String(a.tagih))||b.id-a.id),done=B.filter(x=>x.bayar).length,nm=id=>(find(id)||{}).nama||'-',m={};
B.filter(x=>x.bayar).forEach(x=>{const k=String(x.bayar).slice(0,7);m[k]=(m[k]||0)+1});
return `<div class="card"><h3>Rekap pembelian buku</h3><div class="g2"><div class="card"><h2>${done}</h2><span class="mut">Sudah dibeli</span></div><div class="card"><h2>${B.length-done}</h2><span class="mut">Belum dibayar</span></div></div>
<button onclick="csvBuku()">Unduh rekap buku (CSV)</button>
<table><tr><th>Tagih</th><th>Siswa</th><th>Buku</th><th>Status</th></tr>${B.slice(0,100).map(x=>`<tr><td>${e(x.tagih)}</td><td>${e(nm(x.sid))}</td><td>${e(x.label)}</td><td>${x.bayar?'Dibeli '+e(x.bayar):'Belum'}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Belum ada data. Rekap terisi saat siswa naik level.</td></tr>'}</table>
<h3 style="margin-top:12px">Dibeli per bulan</h3><table>${Object.entries(m).sort((a,b)=>b[0].localeCompare(a[0])).map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')||'<tr><td class="mut">Belum ada.</td></tr>'}</table></div>`}
function csvBuku(){const r=[['Tanggal tagih','No Absen','Nama','Buku','Status','Tanggal dibeli','Dicatat oleh']];
S.books.forEach(x=>r.push([x.tagih,x.sid,(find(x.sid)||{}).nama,x.label,x.bayar?'Sudah dibeli':'Belum dibayar',x.bayar||'',x.by||'']));
const b=new Blob(['\ufeff'+r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});
const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='rekap-buku-aufaby.csv';l.click()}
function csv(){const r=[['Tanggal','No Absen','Nama','Program','Level/Kelas','Datang','Pulang']];
Object.values(S.att).sort((a,b)=>a.d.localeCompare(b.d)).forEach(a=>{const s=find(a.sid)||{};r.push([a.d,a.sid,s.nama,PROG[s.prog],s.lvl,hm(a.in),a.out?hm(a.out):''])});
const b=new Blob(['\ufeff'+r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'});
const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='rekap-absensi-aufaby.csv';l.click()}

/* ===== Portal wali ===== */
function foto(k,w){const a=S.att[k];const p=w==='in'?a.pin:a.pout;
modal(`<h3>Foto ${w==='in'?'datang':'pulang'} · ${hm(w==='in'?a.in:a.out)}</h3>`+(p?`<img src="${p}" alt="Foto absensi">`:`<p>Foto absensi otomatis dihapus setelah ${FOTO_HARI} hari demi menjaga privasi &amp; ruang penyimpanan.</p>`))}
function waliV(){const s=find(ses.id);if(!s){out();return ''}
const k=today()+'|'+s.id,a=S.att[k]||{};
const hist=Object.entries(S.att).filter(([x,v])=>v.sid===s.id&&v.d<today()&&v.in).sort((x,y)=>y[0].localeCompare(x[0])).slice(0,5);
const notes=S.notes.filter(x=>x.sid===s.id).sort((x,y)=>y.m.localeCompare(x.m));
return `<div class="top card hero"><div><h1>Halo mama dan papa (${e(s.nama)})</h1><p class="mut">Wali: ${e(s.wali||'-')}</p></div><button class="ghost" onclick="out()">Keluar</button></div>
<div class="card"><h2>Kehadiran hari ini</h2><p class="mut">${tgl(today())}</p>
<p>Jam datang: ${a.in?`<button class="ghost" onclick="foto('${k}','in')">${hm(a.in)} · lihat foto</button>`:'…'}</p>
<p>Jam selesai: ${a.out?`<button class="ghost" onclick="foto('${k}','out')">${hm(a.out)} · lihat foto</button>`:'…'}</p>
<span class="tag">${a.out?'Sudah pulang':a.in?'Sudah tiba':'Belum hadir'}</span></div>
<div class="card"><h2>Riwayat absensi terakhir</h2>${hist.map(([x,v])=>`<p><b>${tgl(v.d)}</b><br>Sampai di Rumah Belajar Aufaby jam ${hm(v.in)}<br>Pulang jam ${v.out?hm(v.out):'…'}</p>`).join('')||'<p class="mut">Belum ada riwayat.</p>'}</div>
<div class="card"><h2>Program belajar</h2><p>${PROG[s.prog]} · ${lbl(s)} ${s.lulus?'<span class="tag">Lulus program</span>':''}</p></div>
<div class="card"><h2>Tagihan buku</h2>${s.buku?(s.buku.ok?`<p>Buku ${e(s.buku.l)}: <span class="tag">Sudah dibeli, dikonfirmasi tutor</span></p>`:`<p>Buku ${e(s.buku.l)}: <span class="tag o">Belum dibayar</span></p><p class="mut">Mohon segera membeli buku untuk level berikutnya.</p>`):'<p class="mut">Tidak ada tagihan.</p>'}</div>
${payCard(s.id)}<div class="card"><h2>Perkembangan belajar</h2>${notes.map(x=>`<p><b>${x.m}</b> · Tutor ${e(x.tutor)}<br>${e(x.t)}</p>`).join('')||'<p class="mut">Belum ada catatan bulan ini.</p>'}</div>`}

init();
</script>
</body>
</html>
